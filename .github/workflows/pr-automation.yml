name: PR Automation

on:
  pull_request:
    types: [ opened, edited, synchronize, ready_for_review, reopened, closed ]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  sync-pr:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_ID: PVT_kwDOEcbHvs4BcFPz

      STATUS_FIELD_ID: PVTSSF_lADOEcbHvs4BcFPzzhWwoEk
      STATUS_DONE_OPTION_ID: 98236657

      CODE_SIZE_FIELD_ID: PVTSSF_lADOEcbHvs4BcFPzzhW8r8U

      REVIEWERS: bepo03 LFCKJ r1nn-dev rmi9394 Siho-ily

    steps:
      - name: Sync PR labels, reviewers, assignee, and project fields
        shell: bash
        run: |
          set -euo pipefail

          repo="${{ github.repository }}"
          pr_number="${{ github.event.pull_request.number }}"
          pr_node_id="${{ github.event.pull_request.node_id }}"
          actor="${{ github.event.pull_request.user.login }}"
          action="${{ github.event.action }}"
          title="$(jq -r '.pull_request.title // ""' "$GITHUB_EVENT_PATH")"
          additions="$(jq -r '.pull_request.additions // 0' "$GITHUB_EVENT_PATH")"
          deletions="$(jq -r '.pull_request.deletions // 0' "$GITHUB_EVENT_PATH")"
          draft="$(jq -r '.pull_request.draft // false' "$GITHUB_EVENT_PATH")"
          merged="$(jq -r '.pull_request.merged // false' "$GITHUB_EVENT_PATH")"
          changed_lines=$((additions + deletions))
          title_changed="$(jq -r '.changes.title != null' "$GITHUB_EVENT_PATH")"

          if [ "$action" = "opened" ]; then
            gh pr edit "$pr_number" --repo "$repo" --add-assignee "$actor"
          fi

          if [ "$action" = "opened" ] || { [ "$action" = "edited" ] && [ "$title_changed" = "true" ]; }; then
            for label in "💫 feat" "🐛 bug" "⚙️ chore" "📝 docs" "♻️ refactor" "✅ test" "❓ question"; do
              gh issue edit "$pr_number" --repo "$repo" --remove-label "$label" >/dev/null 2>&1 || true
            done

            case "$title" in
              feat\(*|feat:*)
                gh issue edit "$pr_number" --repo "$repo" --add-label "💫 feat"
                ;;
              fix\(*|fix:*)
                gh issue edit "$pr_number" --repo "$repo" --add-label "🐛 bug"
                ;;
              chore\(*|chore:*)
                gh issue edit "$pr_number" --repo "$repo" --add-label "⚙️ chore"
                ;;
              docs\(*|docs:*)
                gh issue edit "$pr_number" --repo "$repo" --add-label "📝 docs"
                ;;
              refactor\(*|refactor:*)
                gh issue edit "$pr_number" --repo "$repo" --add-label "♻️ refactor"
                ;;
              test\(*|test:*)
                gh issue edit "$pr_number" --repo "$repo" --add-label "✅ test"
                ;;
            esac
          fi

          if { [ "$action" = "opened" ] || [ "$action" = "reopened" ] || [ "$action" = "ready_for_review" ]; } && [ "$draft" != "true" ]; then
            reviewers=()
            for reviewer in $REVIEWERS; do
              if [ "$reviewer" != "$actor" ]; then
                reviewers+=("$reviewer")
              fi
            done

            if [ "${#reviewers[@]}" -gt 0 ]; then
              reviewer_csv="$(IFS=,; echo "${reviewers[*]}")"
              gh pr edit "$pr_number" --repo "$repo" --add-reviewer "$reviewer_csv"
            fi
          fi

          sync_project_fields=false

          if [ "$action" = "opened" ] || [ "$action" = "synchronize" ]; then
            sync_project_fields=true
          elif [ "$action" = "closed" ] && [ "$merged" = "true" ]; then
            sync_project_fields=true
          fi

          if [ "$sync_project_fields" != "true" ]; then
            exit 0
          fi

          item_id="$(
            gh api graphql \
              -f contentId=$pr_node_id \
              -f query='
                query($contentId: ID!) {
                  node(id: $contentId) {
                    ... on PullRequest {
                      projectItems(first: 20, includeArchived: false) {
                        nodes {
                          id
                          project {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              ' \
              --jq ".data.node.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\") | .id" \
              | head -n 1
          )"

          if [ -z "$item_id" ]; then
            item_id="$(
              gh api graphql \
                -f projectId="$PROJECT_ID" \
                -f contentId="$pr_node_id" \
                -f query='
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                      item {
                        id
                      }
                    }
                  }
                ' \
                --jq '.data.addProjectV2ItemById.item.id'
            )"
          fi

          update_code_size() {
            local option_id="$1"

            gh api graphql \
              -f projectId="$PROJECT_ID" \
              -f itemId="$item_id" \
              -f fieldId="$CODE_SIZE_FIELD_ID" \
              -f optionId="$option_id" \
              -f query='
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              ' >/dev/null
          }

          update_status() {
            local option_id="$1"

            gh api graphql \
              -f projectId="$PROJECT_ID" \
              -f itemId="$item_id" \
              -f fieldId="$STATUS_FIELD_ID" \
              -f optionId="$option_id" \
              -f query='
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              ' >/dev/null
          }

          if [ "$action" = "opened" ] || [ "$action" = "synchronize" ]; then
            if [ "$changed_lines" -ge 401 ]; then
              update_code_size "cd453446"
            elif [ "$changed_lines" -ge 101 ]; then
              update_code_size "fdae15f1"
            elif [ "$changed_lines" -ge 21 ]; then
              update_code_size "8ac9d3ac"
            else
              update_code_size "0c7df237"
            fi
          fi

          if [ "$action" = "closed" ] && [ "$merged" = "true" ]; then
            update_status "$STATUS_DONE_OPTION_ID"
          fi
