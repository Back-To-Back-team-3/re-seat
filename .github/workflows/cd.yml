name: CD (Continuous Deployment)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build JAR with Gradle
        run: ./gradlew clean build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #latest 및 고유한 github.sha 태그를 동시에 생성하여 Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/re-seat:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/re-seat:${{ github.sha }}

      #EC2 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 새 이미지를 먼저 다운로드받아 준비합니다 (실패 시 기존 서비스 유지)
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/re-seat:${{ github.sha }}

            # 기존 컨테이너 중지 및 삭제
            sudo docker stop re-seat || true
            sudo docker rm re-seat || true

            # 환경 변수를 주입하여 immutable tag 기반으로 컨테이너 실행
            sudo docker run -d -p 8080:8080 \
              --name re-seat \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/re-seat:${{ github.sha }}
