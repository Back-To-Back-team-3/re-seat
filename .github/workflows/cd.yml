name: Java CD with Docker & EC2

on:
  # 1. develop 브랜치로 PR이 올려졌을 때 (빌드 및 Docker 이미지 생성 테스트)
  pull_request:
    branches: [ "develop" ]
    types: [ opened, synchronize ]

  # 2. PR이 Approve되어 develop 브랜치로 Merge(Push)되었을 때 (실제 EC2 배포 실행)
  push:
    branches: [ "develop" ]

jobs:
  # 빌드 및 Docker 푸시 검증 (PR 올라올 때도 실행)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew clean build -x test

  # 실제 EC2 배포 (Push/Merge일 때만 실행)
  deploy:
    needs: build-and-test
    # PR 상태일 때는 실행하지 않고, develop에 최종 Merge 되었을 때만 실행
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/re-seat:latest
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker stop re-seat || true
            sudo docker rm re-seat || true
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/re-seat:latest
            sudo docker run -d -p 8080:8080 --name re-seat ${{ secrets.DOCKERHUB_USERNAME }}/re-seat:latest
            sudo docker image prune -f
