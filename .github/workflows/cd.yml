name: Java CI/CD with Docker & EC2

# develop 브랜치에 코드가 push되면 자동 실행
on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # GitHub 저장소 소스코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v3



      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 빌드(테스트 실행 제외)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker 이미지 빌드 및 Docker Hub로 Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/reseat-app:latest

      # EC2에 SSH 접속하여 최신 컨테이너로 배포 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1) 기존에 실행 중인 동일 이름의 컨테이너 중지 및 삭제 (오류 무시)
            sudo docker stop reseat-app || true
            sudo docker rm reseat-app || true

            # 2) Docker Hub에서 최신 이미지 받아오기
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/reseat-app:latest

            # 3) 새 컨테이너 실행 (8080 포트 포워딩)
            sudo docker run -d -p 8080:8080 --name reseat-app ${{ secrets.DOCKERHUB_USERNAME }}/reseat-app:latest

            # 4) 사용하지 않는 옛날 Docker 이미지 정리
            sudo docker image prune -f
