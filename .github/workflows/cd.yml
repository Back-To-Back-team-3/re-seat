name: CD (Continuous Deployment)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:3.9.2
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build JAR with Gradle
        run: ./gradlew clean build
        env:
          REDIS_PASSWORD: ""
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_PROFILES_ACTIVE: test
          TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/re-seat:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/re-seat:${{ github.sha }}

      - name: Copy Compose configuration to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,prometheus.yml"
          target: "~/re-seat"

      - name: Deploy to EC2 via Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            #EC2 내 배포 작업 디렉터리로 이동 (없을 경우 생성)
            mkdir -p ~/re-seat && cd ~/re-seat

            # docker-compose 전용 .env 파일 동적 생성
            cat <<EOF > .env
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_TAG=${{ github.sha }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID}}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET}}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD}}
            EOF

            # 최신 백엔드 이미지 Pull
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/re-seat:${{ github.sha }}

            # Docker Compose 전체 스택 재구동 (변경 사항 있는 컨테이너만 교체 실행)
            sudo docker-compose up -d

            # 미사용 구형 이미지 정리
            sudo docker image prune -f

            # 배포 후 헬스체크 (Smoke Test)
            echo "Waiting for application to start..."
            for i in {1..12}; do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
              if [ "$HTTP_STATUS" -eq 200 ]; then
                echo "Health check passed! HTTP Status: 200"
                exit 0
              fi
              echo "Health check failed (Status: $HTTP_STATUS). Retrying in 5 seconds..."
              sleep 5
            done

            echo "Deployment Failed: Application health check timeout!"
            exit 1
