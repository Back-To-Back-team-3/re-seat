name: Issue Automation

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  sync-issue-to-project:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: Back-To-Back-team-3
      PROJECT_NUMBER: "1"
      PROJECT_ID: PVT_kwDOEcbHvs4BcFPz

      PRIORITY_FIELD_ID: PVTSSF_lADOEcbHvs4BcFPzzhW8rB4
      SIZE_FIELD_ID: PVTSSF_lADOEcbHvs4BcFPzzhW8ro0
      START_DATE_FIELD_ID: PVTF_lADOEcbHvs4BcFPzzhW8sLM
      DUE_DATE_FIELD_ID: PVTF_lADOEcbHvs4BcFPzzhW8sS4

    steps:
      - name: Sync issue fields
        shell: bash
        run: |
          set -euo pipefail

          repo="${{ github.repository }}"
          issue_number="${{ github.event.issue.number }}"
          issue_url="${{ github.event.issue.html_url }}"
          issue_node_id="${{ github.event.issue.node_id }}"
          actor="${{ github.event.issue.user.login }}"
          action="${{ github.event.action }}"
          created_at="${{ github.event.issue.created_at }}"
          start_date="${created_at:0:10}"

          body="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"

          if [ "$action" = "opened" ]; then
            gh issue edit "$issue_number" --repo "$repo" --add-assignee "$actor"
          fi

          item_id="$(
            gh project item-list "$PROJECT_NUMBER" \
              --owner "$PROJECT_OWNER" \
              --format json \
              --limit 1000 \
              --jq ".items[] | select(.content.url == \"$issue_url\") | .id" \
              | head -n 1
          )"

          if [ -z "$item_id" ]; then
            item_id="$(
              gh api graphql \
                -f projectId="$PROJECT_ID" \
                -f contentId="$issue_node_id" \
                -f query='
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                      item {
                        id
                      }
                    }
                  }
                ' \
                --jq '.data.addProjectV2ItemById.item.id'
            )"
          fi

          update_single_select() {
            local field_id="$1"
            local option_id="$2"

            gh api graphql \
              -f projectId="$PROJECT_ID" \
              -f itemId="$item_id" \
              -f fieldId="$field_id" \
              -f optionId="$option_id" \
              -f query='
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              ' >/dev/null
          }

          update_date() {
            local field_id="$1"
            local date_value="$2"

            gh api graphql \
              -f projectId="$PROJECT_ID" \
              -f itemId="$item_id" \
              -f fieldId="$field_id" \
              -f dateValue="$date_value" \
              -f query='
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $dateValue: Date!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { date: $dateValue }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              ' >/dev/null
          }

          if printf "%s\n" "$body" | grep -Eq '^- \[[xX]\] 🌋 Urgent'; then
            update_single_select "$PRIORITY_FIELD_ID" "14b57b35"
          elif printf "%s\n" "$body" | grep -Eq '^- \[[xX]\] 🏔 High'; then
            update_single_select "$PRIORITY_FIELD_ID" "3802d0d2"
          elif printf "%s\n" "$body" | grep -Eq '^- \[[xX]\] 🏕 Medium'; then
            update_single_select "$PRIORITY_FIELD_ID" "7677d42e"
          elif printf "%s\n" "$body" | grep -Eq '^- \[[xX]\] 🏝 Low'; then
            update_single_select "$PRIORITY_FIELD_ID" "f0f913a0"
          fi

          if printf "%s\n" "$body" | grep -Eq '^- \[[xX]\] 🦑 Large'; then
            update_single_select "$SIZE_FIELD_ID" "32d6720c"
          elif printf "%s\n" "$body" | grep -Eq '^- \[[xX]\] 🐂 Medium'; then
            update_single_select "$SIZE_FIELD_ID" "cd4f84f5"
          elif printf "%s\n" "$body" | grep -Eq '^- \[[xX]\] 🐇 Small'; then
            update_single_select "$SIZE_FIELD_ID" "5d674ca8"
          elif printf "%s\n" "$body" | grep -Eq '^- \[[xX]\] 🦔 Tiny'; then
            update_single_select "$SIZE_FIELD_ID" "8d825388"
          fi

          if [ "$action" = "opened" ]; then
            update_date "$START_DATE_FIELD_ID" "$start_date"
          fi

          due_date="$(
            printf "%s\n" "$body" \
              | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' \
              | tail -n 1 || true
          )"

          if [ -n "$due_date" ]; then
            update_date "$DUE_DATE_FIELD_ID" "$due_date"
          fi
