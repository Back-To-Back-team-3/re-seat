# ===================================================================
# [test-concurrency] 동시성 테스트 전용 — 명시적 로컬 MySQL 실행
# ===================================================================
spring:
  config:
    activate:
      on-profile: test-concurrency
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/reseat_concurrency_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

  kafka:
    admin:
      auto-create: false
    listener:
      auto-startup: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            redirect-uri: http://localhost/login/oauth2/code/kakao

oauth2:
  redirect:
    frontend-url: http://localhost:5173

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173,https://re-seat.netlify.app

