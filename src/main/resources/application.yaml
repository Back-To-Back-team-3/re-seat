# ===================================================================
# 1. 공통 및 로컬(기본) 개발 환경 설정 블록
# ===================================================================
spring:
  profiles:
    active: local
    default: local


  data:
    web:
      pageable:
        page-serialization-mode: via_dto
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:myredispassword} # 로컬 Redis 비밀번호 (환경 변수 또는 기본값)

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 2dd0bc84e44e8e35833ebd25769ecaaa
            client-secret: 4UeLVH2vvXa4kgxLhBwXQm12WOBgVqGa
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    url: jdbc:h2:mem:reseatdb;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true # 이미 데이터가 있는 환경에서도 안전하게 히스토리 시작하는 옵션
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

jwt:
  # 로컬용 더미 시크릿 키 유지
  secret: c3ByaW5nYm9vdC1zZWN1cml0eS1qd3QtdG9rZW4tc2VjcmV0LWtleS1kZW1vLWJmYWtiZmtiYWZiYWY=

#로컬/테스트 환경에서도 읽을 수 있도록 공통 구역으로 이동.
portone:
  api-secret: Ww77BFpCWTsbOGUUbIz1VFiSiafUhvciyIbcH5USJ9LJeIcHDuHp12PDgcTHKSFOcJ2u7dkvf0zwHPPx

# 토스페이먼츠 문서용 테스트 키(회원가입 없이 공개적으로 쓸 수 있는 공용 테스트 키, 실제 결제는 발생하지 않음).
toss:
  # 프론트엔드에서 Toss 결제 위젯을 초기화할 때 사용하는 공개 클라이언트 키.
  client-key: ${TOSS_CLIENT_KEY:test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq}
  secret-key: ${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
  base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}

---
# ===================================================================
# 2. 도커 컴포즈 가동을 위한 운영(prod) 환경 설정 블록
# ===================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://mysql-db:3306/reseat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:?REDIS_PASSWORD environment variable must be set!} #환경 변수로부터 주입

  flyway:
    enabled: true
    baseline-on-migrate: true # 이미 데이터가 있는 환경에서도 안전하게 히스토리 시작하는 옵션
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET environment variable must be set!}

---
# ===================================================================
# 3. Gradle test 및 CI 환경을 위한 테스트(test) 전용 우회 블록
# ===================================================================
spring:
  config:
    activate:
      on-profile: test

  # MySQL DDL 스크립트 억까를 방지하기 위해 Flyway를 정지시킵니다.
  flyway:
    enabled: false

  # Flyway가 멈춘 자리에 하이버네이트가 H2 규격에 맞춰 직접 테이블을 빌드하고 휘발시키도록 명령합니다.
  jpa:
    hibernate:
      ddl-auto: create-drop
