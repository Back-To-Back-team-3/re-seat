# ===================================================================
# 1. 공통 및 로컬(기본) 개발 환경 설정 블록
# ===================================================================
spring:
  profiles:
    active: local
    default: local

  datasource:
    url: jdbc:h2:mem:reseatdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:myredispassword} # 로컬 Redis 비밀번호 (환경 변수 또는 기본값)

  flyway:
    enabled: true
    baseline-on-migrate: true # 이미 데이터가 있는 환경에서도 안전하게 히스토리 시작하는 옵션
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

jwt:
  # 로컬용 더미 시크릿 키 유지
  secret: c3ByaW5nYm9vdC1zZWN1cml0eS1qd3QtdG9rZW4tc2VjcmV0LWtleS1kZW1vLWJmYWtiZmtiYWZiYWY=

#로컬/테스트 환경에서도 읽을 수 있도록 공통 구역으로 이동.
portone:
  api-secret: "MOCK_PORTONE_SECRET_TOKEN"

---
# ===================================================================
# 2. 도커 컴포즈 가동을 위한 운영(prod) 환경 설정 블록
# ===================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://mysql-db:3306/reseat?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:?REDIS_PASSWORD environment variable must be set!} #환경 변수로부터 주입

  flyway:
    enabled: true
    baseline-on-migrate: true # 이미 데이터가 있는 환경에서도 안전하게 히스토리 시작하는 옵션
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:?JWT_SECRET environment variable must be set!}
