# ====================================================================
# HTTP (80) -> HTTPS (443) 영구 리다이렉트
# ====================================================================
server {
    listen 80;
    server_name reseat-api.duckdns.org;

    # Certbot SSL 인증서 발급/갱신 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 모든 HTTP 요청을 HTTPS로 301 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ====================================================================
# HTTPS (443) 리버스 프록시 서버
# ====================================================================
server {
    listen 443 ssl;
    server_name reseat-api.duckdns.org;

    # SSL 인증서 경로 (Let's Encrypt / Certbot이 발급하는 경로)
    ssl_certificate /etc/letsencrypt/live/reseat-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reseat-api.duckdns.org/privkey.pem;

    # 권장 SSL 보안 프로토콜 및 암호화 스위트
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 프록시 기본 헤더 (클라이언트 실제 IP 및 스키마 전달)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ----------------------------------------------------------------
    # 1. Re:Seat 대기열 SSE 스트리밍 라우팅 (/api/v1/queues)
    # ----------------------------------------------------------------
    location /api/v1/queues {
        proxy_pass http://web-app:8080;

        # SSE 실시간 스트리밍 필수 설정 (버퍼링 차단)
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # 대기열 연결 유지를 위한 타임아웃 1시간 연장
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----------------------------------------------------------------
    # 2. 일반 백엔드 API 라우팅
    # ----------------------------------------------------------------
    location / {
        proxy_pass http://web-app:8080;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}